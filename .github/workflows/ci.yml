name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ruff is pinned: the repo has no ruff config, so the rule set is the
      # installed version's defaults. Bump this alongside your local ruff.
      - name: Install tools and dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          pip install -r requirements.txt ruff==0.16.8

      - name: Run gate
        run: bash scripts/gate.sh
